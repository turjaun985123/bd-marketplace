[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
courier = { path = "../courier" }
domain = { path = "../domain" }
hex = "0.4"
hmac = "0.12"
# Wave 39 (security audit CR-02): jsonwebtoken 10.x — 9.3.1 is
# CVE-2026-25537 (type confusion lets a crafted JWK header bypass
# verification). v10 splits the crypto backend behind features;
# `rust_crypto` is the provider matching the previous ring-based
# HS256 usage, and default features (PEM key parsing) are off
# because this crate only ever uses `from_secret` HMAC keys.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
notify = { path = "../notify" }
payments = { path = "../payments" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
