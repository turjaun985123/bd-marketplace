[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Wave 51: `multipart` for the image upload endpoints.
axum = { version = "0.7", features = ["multipart"] }
# Wave 53 fix: axum-extra's Query extractor (serde_htmlform)
# is the one that deserialises repeated query params
# (?category=a&category=b) into a Vec — serde_urlencoded
# (axum's built-in Query) rejects them with a plain-text 400.
axum-extra = { version = "0.9", features = ["query"] }
# Wave 51: the media store trait is object-safe async
# (`Arc<dyn MediaStore>` in AppState) — the same crate the
# notify crate's senders use.
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
courier = { path = "../courier" }
domain = { path = "../domain" }
hex = "0.4"
hmac = "0.12"
# Wave 51: image decode + resize + re-encode for the media
# pipeline. Default features OFF: only the three accepted
# formats are compiled in (the domain sniff refuses
# everything else before decode anyway), and no format's
# decoder can be reached with a format the platform does
# not accept.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Wave 39 (security audit CR-02): jsonwebtoken 10.x — 9.3.1 is
# CVE-2026-25537 (type confusion lets a crafted JWK header bypass
# verification). v10 splits the crypto backend behind features;
# `rust_crypto` is the provider matching the previous ring-based
# HS256 usage, and default features (PEM key parsing) are off
# because this crate only ever uses `from_secret` HMAC keys.
# Wave 47: jsonwebtoken 12.x — the v12 manifest keeps the same
# feature layout (default = ["use_pem"]; `rust_crypto` = the
# RustCrypto provider set), so the declaration below is
# unchanged apart from the version. v12 resolves rsa 0.10 and
# crypto-bigint 0.7.11; see the README Wave 47 section for
# what that did to the Wave 42 audit ignores.
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
notify = { path = "../notify" }
payments = { path = "../payments" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Wave 42 (dependency hygiene): default features OFF. sqlx's
# defaults (any, macros, migrate, json) pull the MySQL and
# SQLite drivers into the graph via the `any` feature —
# libsqlite3-sys carried a bundled-SQLite CVE
# (RUSTSEC-2026-0459) for a database this platform never
# opens. `macros` is restored explicitly (FromRow derives +
# migrate! are used throughout); `migrate` was already
# explicit. `json` is deliberately NOT restored: jsonb is
# bound and read as text with ::jsonb / ::text casts (see
# audit.rs), so the feature was never exercised. `any` is
# dropped outright — no sqlx::Any types exist in the tree.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
