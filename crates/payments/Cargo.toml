[package]
name = "payments"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
