name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Used by the Wave 2 integration test (crates/api/tests/wave2.rs),
      # which runs the real migrations against this database.
      DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  # Wave 20: the deployment images must always build. Build only
  # — nothing is pushed to a registry from CI.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t bd-marketplace-api .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t bd-marketplace-worker .
      - name: Build web image
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
          -t bd-marketplace-web apps/web
