name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Used by the Wave 2 integration test (crates/api/tests/wave2.rs),
      # which runs the real migrations against this database.
      DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace
      # Wave 31: prove the backup story end-to-end on every run —
      # dump the test database the suites just migrated, restore
      # it into a scratch database, and check the schema survived
      # the round trip. This is the same pg_dump -> psql flow
      # scripts/backup.sh + scripts/restore.sh automate for the
      # operator; if a migration ever produces a schema pg_dump
      # cannot round-trip, this step fails here, not in recovery.
      - name: Verify backup + restore
        run: |
          set -euo pipefail
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          export PGPASSWORD=marketplace
          pg_dump -h localhost -U marketplace -d marketplace_test \
            -f /tmp/ci-backup.sql
          createdb -h localhost -U marketplace marketplace_restore_check
          psql -h localhost -U marketplace -d marketplace_restore_check \
            -v ON_ERROR_STOP=1 -q -f /tmp/ci-backup.sql
          tables=$(psql -h localhost -U marketplace \
            -d marketplace_restore_check -tAc \
            "SELECT count(*) FROM information_schema.tables \
             WHERE table_schema = 'public'")
          echo "restored public tables: $tables"
          [ "$tables" -gt 20 ]
          [ "$(psql -h localhost -U marketplace \
            -d marketplace_restore_check -tAc \
            "SELECT to_regclass('public.orders')")" = "orders" ]
          dropdb -h localhost -U marketplace marketplace_restore_check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # User rule (2026-11-26): no local builds — the runnable
      # server binaries are produced HERE and downloaded from the
      # run's artifacts. Release profile, api + worker only.
      - name: Build release server binaries
        run: cargo build --release -p api -p worker
      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: |
            target/release/api
            target/release/worker
          retention-days: 14

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build
        working-directory: apps/web
        env:
          # Empty = same-origin relative API calls, so the
          # standalone bundle can sit behind any reverse proxy
          # that routes /v1 to the API (the live-demo shape).
          NEXT_PUBLIC_API_BASE_URL: ""
        run: |
          npm ci
          npm run build
      # Wave 38: the PWA wiring check — sw.js never-cache
      # deny markers, manifest presence, and icon files
      # whose IHDR dimensions match their promised sizes.
      - name: Check PWA wiring
        working-directory: apps/web
        run: node scripts/check-pwa.mjs
      # Package the standalone server the same way the web
      # Dockerfile does (static + public copied in) and upload
      # it as a downloadable artifact — no local builds.
      - name: Upload web standalone bundle
        working-directory: apps/web
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf /tmp/web-standalone.tar.gz -C .next/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: /tmp/web-standalone.tar.gz
          retention-days: 14

  # Wave 41 (security audit A14-15): dependency advisory
  # visibility. `cargo audit` checks Cargo.lock against the
  # RustSec advisory database on every run, so a vulnerable
  # dependency (the class of finding CR-02/jsonwebtoken was)
  # is SEEN the day it is published instead of at the next
  # manual audit. Deliberately NON-GATING for now: this job
  # is separate (no `needs` either way) and marked
  # continue-on-error, so its result never blocks the
  # rust/web/docker jobs or the run's conclusion — the first
  # reports get triaged first, and making it gating is a
  # follow-up decision (see the Wave 41 README section).
  security-audit:
    name: Security audit (cargo audit, non-gating)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # The committed Cargo.lock is intentionally minimal around the
      # Wave 39 jsonwebtoken bump (cargo completes it at build time);
      # cargo-audit parses the lock strictly, so resolve it in-job
      # first or the audit fails on the lock instead of reporting.
      - uses: dtolnay/rust-toolchain@stable
      - name: Complete the lockfile for the audit
        run: cargo generate-lockfile
      # Triage aid: if a flagged crate survives a feature diet, its
      # reverse-dependency chain is printed here so the next wave
      # can see exactly which declaration pulls it in.
      - name: Reverse-dependency chains for flagged crates
        run: |
          cargo tree --target all -i libsqlite3-sys || true
          cargo tree --target all -i sqlx-sqlite || true
          cargo tree --target all -i sqlx-mysql || true
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Wave 20: the deployment images must always build. Build only
  # — nothing is pushed to a registry from CI.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t bd-marketplace-api .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t bd-marketplace-worker .
      - name: Build web image
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
          -t bd-marketplace-web apps/web
