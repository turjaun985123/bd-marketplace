# cargo-audit configuration for bd-marketplace.
#
# Read by `cargo audit` and by the CI `security-audit` job
# (rustsec/audit-check, Wave 41) on every run. An entry in
# the ignore list below is an ACCEPTED-RISK record, not a
# deletion of the finding: cargo audit still prints ignored
# advisories in its report, so a stale ignore stays visible
# and must be removed at its review trigger. Every ignore
# carries its justification and its expiry condition.
# Added in Wave 42; see the README "Wave 42" section for the
# full triage of the first audit report.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — `rsa` 0.9.10: Marvin Attack timing
    # sidechannel in RSA private-key decryption/signing
    # operations (patched in rsa >= 0.10).
    #
    # Why it is STILL in the tree (rewritten in Wave 47):
    # the Wave 42 version of this note blamed jsonwebtoken,
    # and Wave 47's jsonwebtoken 12 bump DID move
    # jsonwebtoken to the patched line — its `rust_crypto`
    # feature now declares `rsa = "0.10"`, and a fresh
    # resolution carries rsa 0.10.0 for it. But rsa 0.9.10
    # remains in the resolved graph with exactly one
    # remaining parent: `sqlx-mysql` 0.8.6. That is the
    # Wave 42 welding mechanism again — sqlx 0.8's
    # migration-macro support (sqlx-macros-core) pulls all
    # three database drivers into the resolved graph while
    # `sqlx::migrate!()` is used, and sqlx-mysql's manifest
    # pins the old rsa line. (The fully-resolved graph
    # shows sqlx-mysql was a second parent of rsa 0.9.10
    # all along; the Wave 42 note, written from the
    # committed lock's records, named only jsonwebtoken.)
    #
    # Why the risk is accepted: two independent reasons.
    # (1) Compile-time only — the shipped api/worker
    # binaries enable sqlx's postgres features only, so
    # sqlx-mysql (and its rsa) is never linked into them,
    # exactly like libsqlite3-sys below. (2) Even where
    # jsonwebtoken's own rsa copy is concerned, this
    # platform signs and verifies JWTs with HS256 (HMAC)
    # ONLY — `EncodingKey::from_secret` /
    # `DecodingKey::from_secret` and
    # `Validation::new(Algorithm::HS256)` in
    # crates/api/src/auth.rs are the only jsonwebtoken key
    # operations in the codebase. A tree-wide grep finds no
    # `from_rsa` / `from_ec` constructors and no RS*/ES*
    # algorithm identifiers, so no RSA private-key operation
    # (the only path the Marvin Attack measures) can ever
    # execute.
    #
    # Review trigger: REMOVE this ignore when a sqlx
    # release resolves `rsa >= 0.10` for its MySQL driver,
    # when sqlx stops welding the drivers into
    # sqlx-macros-core, or when this platform drops
    # `sqlx::migrate!()` — whichever comes first. The
    # audit job keeps printing the advisory until then.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0459 — `libsqlite3-sys` 0.30.1, bundled
    # SQLite CVE-2026-119375 (uninitialised page-cache memory
    # returned when opening a database file together with a
    # sibling WAL file of a different page size).
    #
    # Why it is in the graph at all: NOT through any feature
    # this workspace enables. Wave 42 set
    # `default-features = false` on every sqlx dependency,
    # which removed the umbrella's `any`-driven path — but
    # the generated lock's parent records (printed in the CI
    # audit job) prove `sqlx-sqlite` is also a dependency of
    # `sqlx-macros-core`: sqlx 0.8's migration-macro support
    # welds all three database drivers into the macros
    # crate, so dropping the `migrate` feature is the only
    # way to remove it, and `sqlx::migrate!()` is how both
    # binaries apply migrations.
    #
    # Why the risk is accepted: the crate exists only on
    # the compile-time (proc-macro) side of the build. The
    # shipped api/worker binaries enable sqlx's postgres
    # features only — SQLite is not linked into them, and
    # no code path in this platform ever opens a SQLite
    # database (runtime storage is PostgreSQL only). The
    # CVE's precondition — a process opening an
    # attacker-crafted database + WAL file pair — cannot
    # occur here.
    #
    # Review trigger: REMOVE this ignore when a sqlx
    # release stops welding the drivers into its macros
    # crate, when this platform drops `sqlx::migrate!()`,
    # or if any SQLite use is ever introduced — whichever
    # comes first.
    "RUSTSEC-2026-0459",
]

# Retired ignores:
#
# - RUSTSEC-2026-0387 (`crypto-bigint` 0.5.5, timing
#   variability, patched >= 0.7.6): ignore REMOVED in
#   Wave 47. Its review trigger fired — jsonwebtoken 12's
#   tree resolves p256/p384 0.14 -> elliptic-curve 0.14.3,
#   and a fresh resolution (Dependabot PR #13's lock)
#   contains crypto-bigint 0.7.11 as the ONLY version;
#   the vulnerable 0.5.5 left the graph entirely, so the
#   advisory no longer matches anything and keeping the
#   ignore would have been stale config.

# Deliberately NOT ignored:
#
# - RUSTSEC-2026-0543 (`chrono` unmaintained):
#   informational-warning class only, not a vulnerability.
#   chrono stays for now; migrating the codebase's
#   timestamps to `time` or `jiff` is a deliberate refactor
#   wave of its own, not a drive-by (see README, Wave 42).
